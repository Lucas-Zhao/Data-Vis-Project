<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon matchup visualizations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F5;--surface:#fff;--ink:#1D2633;--muted:#5C6878;--line:#C9D1DC;
  --red:#D8372B;--blue:#2F5F8F;--accent:#F2C230;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151A22;--surface:#1E2530;--ink:#E8ECF2;--muted:#9AA6B6;--line:#334052;--red:#E4473B;--blue:#4F86BC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151A22;--surface:#1E2530;--ink:#E8ECF2;--muted:#9AA6B6;--line:#334052;--red:#E4473B;--blue:#4F86BC;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body)}
#app{height:100%}
h1,h2{font-family:var(--head);margin:0;line-height:1.05}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Hub: two halves meeting at a Poké Ball seam */
.hub{height:100%;display:flex;position:relative}
.hub-title{position:absolute;top:1.25rem;left:1.5rem;z-index:2;color:#fff;font:800 1.1rem/1.2 var(--head);pointer-events:none}
.half{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:.6rem;padding:2rem clamp(1.5rem,5vw,4rem);color:#fff;transition:flex-grow .35s ease}
.half:hover,.half:focus-visible{flex-grow:1.35}
.half.plain{background:var(--red)}
.half.spec{background:var(--blue);text-align:right;align-items:flex-end}
.half h2{font-size:clamp(2rem,5vw,4rem);font-weight:800;max-width:10ch}
.half p{margin:0 0 2rem;max-width:30ch;opacity:.92}
.ball{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;pointer-events:none;z-index:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));transition:left .35s ease,top .35s ease}
/* The halves resize on hover, so the ball rides the seam: 1.35 / 2.35 = 57.4% */
.hub:has(.plain:hover,.plain:focus-visible) .ball{left:57.4%}
.hub:has(.spec:hover,.spec:focus-visible) .ball{left:42.6%}

/* Shared pages */
.page{height:100%;display:flex;flex-direction:column;padding:1rem clamp(1rem,3vw,2rem)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding-bottom:.75rem}
.bar .mid{text-align:center}
.bar .mid h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:800}
.bar .mid a{color:var(--muted);font-size:.9rem;text-decoration:underline}
.bar .right{justify-self:end}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border:2px solid var(--ink);border-radius:999px;
  background:var(--surface);color:var(--ink);font:500 .95rem var(--body);cursor:pointer}
.btn:hover:not([aria-disabled="true"]){background:var(--ink);color:var(--bg)}
.btn[aria-disabled="true"]{opacity:.35;cursor:default}

/* Matchup list */
.grid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,200px));gap:1rem;align-content:center;justify-content:center;width:100%;margin:0 auto;padding:1rem 0 2rem}
.tile{aspect-ratio:3/2;white-space:nowrap;display:flex;align-items:center;justify-content:center;padding:1rem;border-radius:14px;background:var(--surface);
  border:2px solid var(--line);font:800 1.4rem/1.1 var(--head);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--red);transform:translateY(-3px)}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,200px))}}

/* Matchup view */
.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--line)}
.tab{padding:.6rem 1.1rem;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:none;color:var(--muted);font:500 1rem var(--body);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:500}
.stage{flex:1;min-height:0;margin-top:1rem;background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:auto}
.stage svg{width:100%;height:100%;display:block}
.stage text{fill:var(--muted);font-family:var(--body)}
.soon{flex:1;display:grid;place-content:center;text-align:center;gap:.5rem;color:var(--muted)}
.soon h2{color:var(--ink);font-size:2rem}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem 4.5rem;padding:1.25rem}
.team h2{font-size:1.3rem;margin-bottom:.6rem}
.roster{display:grid;grid-template-columns:repeat(2,max-content);justify-content:start;align-items:start;gap:.6rem}
.mon{background:#8F1D2C;color:#fff;border-radius:6px 20px 6px 6px;padding:.55rem .6rem;max-width:26rem}
.mon header{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:.4rem;margin-bottom:.4rem}
.mon h3{margin:0;white-space:nowrap;margin-right:auto;font:800 .95rem/1.1 var(--head);text-transform:uppercase}
.chips{display:flex;gap:.25rem;justify-content:center}
.side{display:grid;justify-items:center;gap:.4rem}
.chip{display:inline-grid;place-items:center;min-width:1.4rem;height:1.2rem;padding:0 .25rem;border-radius:4px;background:#566;color:#fff;font:700 .65rem var(--body)}
.ticon{width:1.35rem;height:1.35rem;flex:none;display:block}
.iicon{width:1.3rem;height:1.3rem;margin-left:.2rem}
.mon-body{display:grid;grid-template-columns:9.1rem auto;gap:.5rem;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.35rem}
.pills span{white-space:nowrap;line-height:1.2;display:inline-flex;align-items:center;background:#fff;color:#7a1624;border-radius:999px;padding:.05rem .5rem;font-size:.72rem;font-weight:500}
.mon ul{list-style:none;margin:0;padding:0;display:grid;gap:.2rem;width:100%}
.mon li{white-space:nowrap;display:flex;align-items:center;gap:.35rem;background:#fff;color:#2b1418;border-radius:4px;padding:.1rem .3rem;font-size:.78rem;font-weight:500}
.sprite{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font:800 1.8rem var(--head);color:#fff;text-shadow:0 2px 3px #0006;overflow:hidden;border:3px solid #fff}
.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sprite.ok span{display:none}
.note{grid-column:1/-1;margin:0;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.trow{display:grid;grid-template-columns:64px 10.5rem 4.5rem 4.5rem;align-items:center;gap:.6rem;width:fit-content;padding:.5rem .7rem;background:#8F1D2C;color:#fff;border-radius:6px 16px 6px 6px}
.trow.thead{background:none;color:var(--muted);padding-block:0}
.thead b{text-align:center;font-weight:500;font-size:.85rem}
.trow .sprite{width:58px;height:58px;border-width:2px;font-size:1.2rem}
.trow strong{font:800 .95rem var(--head)}
.trow .chips{justify-content:flex-start;margin-top:.25rem}
.trow[role=button]{cursor:pointer}.trow[role=button]:hover{background:#9c2233}
.titem{width:fit-content}.caret{font-style:normal;display:inline-block;transition:transform .15s;opacity:.8}.trow.open .caret{transform:rotate(180deg)}
.tdetail{margin-top:.25rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem .6rem;min-width:100%}
.tdetail[hidden]{display:none}
.bd h4{margin:.5rem 0 .25rem;font:800 .8rem var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.bdrow{display:grid;grid-template-columns:8.5rem 1fr 4.2rem 2.4rem;align-items:center;gap:.5rem;padding:.15rem 0;font-size:.82rem;border-bottom:1px solid var(--line)}
.bdmove{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}.bdnone{color:var(--muted)}
.bdmult{color:var(--muted);text-align:right;white-space:nowrap}.bdpts{text-align:right;font-weight:800}
.bdpts.pos{color:#1B7F3A}.bdpts.neg{color:#C62828}
.bdtotal{border-bottom:0;font-weight:800}
.score{text-align:center;background:#fff;color:#000;border-radius:6px;padding:.3rem .4rem;font:800 1.1rem var(--head)}
.score.pos{color:#1B7F3A}
.score.neg{color:#C62828}
.score.zero{color:#000}
.rank{font:500 .68rem var(--body);background:#fff;color:#7a1624;border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.role{font:500 .68rem var(--body);background:#ffffff26;color:#fff;border:1px solid #fff8;border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.star{font-size:.9rem;line-height:1;margin-left:.3rem}.star.b{color:#2F7DE1}.star.y{color:#E8A800}
.keynote .star{margin:0 .15rem}.keynote{padding:.2rem .9rem 0}
.tester{padding:1rem 1.25rem 1.5rem}
.tester .note{margin-bottom:.6rem}
.legend2{display:block;margin-top:.3rem;font-size:.85rem}
.swatch{display:inline-block;width:.9rem;height:.9rem;border-radius:3px;vertical-align:-.1rem;margin:0 .3rem 0 .8rem;border:3px solid #FFC400;background:#fff}.swatch:first-child{margin-left:0}
.swatch.x{border:0;background:none;color:#E01B1B;font:800 1.3rem/1 var(--head);width:auto;height:auto;margin-left:.8rem}
.tctl{display:flex;gap:.4rem;margin-bottom:.8rem}
.field{display:grid;grid-template-columns:auto minmax(0,1fr) 3.5rem minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem;border-radius:14px;background:linear-gradient(90deg,#2f5f8f14,transparent 35%,transparent 65%,#d8372b14);border:2px dashed var(--line)}
.vs{font:800 1.6rem var(--head);color:var(--muted);text-align:center}
.tcol{display:flex;flex-direction:column;gap:.5rem}
.zcol{display:grid;gap:1rem;align-content:center}
.zone{min-height:18rem;display:grid;align-items:start;justify-items:center;border:2px dashed var(--line);border-radius:12px;padding:.5rem;transition:background .12s,border-color .12s}
.zone.full{border-style:solid;border-color:transparent;padding:0;min-height:0}
.zone.over{background:#F2C23033;border-color:#F2C230}
.zhint{align-self:center;color:var(--muted);text-align:center;padding:2rem 1rem}
.tcard{position:relative;width:100%;max-width:23rem;background:#8F1D2C;color:#fff;border-radius:6px 20px 6px 6px;padding:.7rem .75rem;cursor:grab}
.tx{position:absolute;top:.3rem;right:.5rem;border:0;background:#ffffff30;color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;font-size:1rem;line-height:1;cursor:pointer}
.thead2{display:flex;align-items:center;gap:.7rem;margin-bottom:.45rem;padding-right:1.6rem}
.thead2 strong{font:800 1.05rem var(--head);text-transform:uppercase}
.thead2 .chips{justify-content:flex-start;margin-top:.25rem}
.tmoves{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.35rem}
.tm{display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:#fff;color:#2b1418;border:3px solid transparent;border-radius:6px;padding:.25rem .45rem;font:500 .85rem var(--body)}
.tmname{display:flex;align-items:center;gap:.4rem;min-width:0}
.tmtags{display:flex;align-items:center;gap:.4rem}
.tm.strong{border-color:#FFC400;background:#FFFBEA;box-shadow:0 0 0 2px #FFE27A80,0 0 12px #FFC400aa}
.good{display:inline-flex;align-items:center;gap:.2rem;color:#8a5a00;font-weight:800;font-size:.8rem;white-space:nowrap}
.nope{display:inline-flex;position:relative}
.nope .sprite{opacity:.8}
.nope::after{content:"\00d7";position:absolute;inset:-4px;display:grid;place-items:center;font:800 2.1rem/1 var(--head);color:#E01B1B;text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 6px #fff}
.mini .sprite{width:28px;height:28px;border-width:2px;font-size:.8rem}
.tp{display:grid;justify-items:center;gap:.15rem;width:5.2rem;padding:.3rem .1rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 .7rem var(--body);cursor:grab}
.tp:hover{border-color:var(--ink)}.tp.used{opacity:.4}
.tp .sprite{width:52px;height:52px;border-width:2px;font-size:1.1rem}
@media (max-width:1000px){.field{grid-template-columns:1fr}.tcol{flex-direction:row;flex-wrap:wrap}.zone{min-height:0}.vs{padding:.2rem}}
.rank.low{background:#ffffff40;color:#fff}
.nctl{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.8rem 1rem 0}
.nctl>span{color:var(--muted);font-size:.9rem;margin-right:.2rem}
.cbtn{padding:.3rem .8rem;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font:500 .85rem var(--body);cursor:pointer}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nodewrap{position:relative;width:100%;max-width:1000px;aspect-ratio:16/9;margin:0 auto}
.nodewrap svg{position:absolute;inset:0;width:100%;height:100%}
.nodewrap .lbl text{fill:var(--ink)}
.nnode{position:absolute;transform:translate(-50%,-50%);text-align:center;width:130px}
.nnode .sprite{width:78px;height:78px;margin:0 auto;border-color:var(--line)}
.nnode.sel .sprite{border-color:var(--red)}
.nnode.dim{opacity:.35}
.nlabel{font:800 .85rem/1.1 var(--head);margin-top:.25rem}
.legend{padding:0 1rem 1rem;color:var(--muted);font-size:.9rem;display:grid;gap:.3rem}
.legend b{display:inline-block;width:2rem;height:0;border-top:6px solid #D8372B;vertical-align:middle;margin-right:.3rem;border-radius:3px}
.legend b.thin{border-top:2px solid #8A97AA}
.legend b.max{box-shadow:0 0 0 4px #F2C23099}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.35rem;vertical-align:-1px}
.nodewrap .lbl text.max{fill:#1D2633}
.nbody{display:flex;gap:1rem;align-items:flex-start;padding:.5rem 1rem 0}
.nbody .nodewrap{flex:1;min-width:0;max-width:none;margin:0}
.cpanel{width:300px;flex:none;padding:.7rem;border:2px solid var(--line);border-radius:12px}
.cpanel h3{margin:0 0 .4rem;font:800 1rem var(--head)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.15rem 0;border-top:1px solid var(--line)}
.crow.chead{border-top:0}
.ccells{display:flex;position:relative}
.ccell,.hcell{width:34px;height:30px;display:grid;place-items:center}
.hcell .sprite{width:28px;height:28px;border-width:2px;font-size:.75rem}
.cbar{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;opacity:.55}
.cdot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.cpct{font:800 .75rem/1.1 var(--head);text-align:right;white-space:nowrap}
.cnone,.cnote{margin:.5rem 0 0;color:var(--muted);font-size:.8rem}
@media (max-width:900px){.nbody{flex-direction:column}.cpanel{width:100%}}
@media (max-width:1100px){.teams{grid-template-columns:1fr}}
@media (max-width:560px){.roster{grid-template-columns:1fr}}
@media (max-width:560px){.hub{flex-direction:column}.hub:has(.plain:hover,.plain:focus-visible) .ball{left:50%;top:57.4%}.hub:has(.spec:hover,.spec:focus-visible) .ball{left:50%;top:42.6%}.half.spec{text-align:left;align-items:flex-start}.half{justify-content:center}.hub-title{top:.75rem}.ball{width:84px;height:84px;margin:-42px 0 0 -42px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function typeScore(p, enemyTeam){
  return {off: enemyTeam.reduce((s, d) => s + points(strongest(p, d)), 0),
          def: 0 - enemyTeam.reduce((s, a) => s + points(strongest(a, p)), 0)};
}
const multText = x => x === 0 ? 'No effect' : x === .5 ? '\u00bd\u00d7' : x === .25 ? '\u00bc\u00d7' : x + '\u00d7';
const signed = n => (n > 0 ? '+' : '') + n;
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero';
/* One dropdown block: for each opposing Pokemon, which move decided the points */
function breakdown(title, rows, total){
  return `<div class="bd"><h4>${title}</h4>${rows.map(r => `<div class="bdrow"><span class="bdwho">vs ${dn(r.who)}</span>${r.mv ? `<span class="bdmove">${chip(r.mv.type)}${r.mv.name}</span><span class="bdmult">${multText(r.mv.mult)}</span>` : `<span class="bdmove bdnone">No damaging move</span><span class="bdmult"></span>`}<span class="bdpts ${cls(r.pts)}">${signed(r.pts)}</span></div>`).join('')}
    <div class="bdrow bdtotal"><span class="bdwho">Total</span><span class="bdmove"></span><span class="bdmult"></span><span class="bdpts ${cls(total)}">${signed(total)}</span></div></div>`;
}
function detailHtml(p, enemy){
  const off = enemy.map(d => { const mv = bestMove(p, d); return {who:d.name, mv, pts:mv ? points(mv.mult) : 0}; });
  const def = enemy.map(a => { const mv = bestMove(a, p); return {who:a.name, mv, pts:mv ? 0 - points(mv.mult) : 0}; });
  return breakdown('Offense: this Pok\u00e9mon\u2019s best move against each opponent', off, off.reduce((t, r) => t + r.pts, 0))
       + breakdown('Defense: each opponent\u2019s best move against this Pok\u00e9mon', def, def.reduce((t, r) => t + r.pts, 0));
}
const scoreBox = n => `<div class="score ${n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero'}">${n > 0 ? '+' : ''}${n}</div>`;
function spriteHtml(p){
  const c = TYPE_COLORS[p.types[0]];
  return `<div class="sprite" style="background:radial-gradient(circle at 35% 30%,#fff8,${c})"><span>${p.name[0]}</span><img src="${spriteUrl(p)}" alt="${dn(p.name)}" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></div>`;
}
function renderTypes(el, m, mode){
  const list = (label, team, enemy) => `<section class="team"><h2>${label}</h2><ul class="tlist"><li class="trow thead"><span></span><span></span><b>Offense</b><b>Defense</b></li>${team.map(raw => {
    const p = shown(raw, mode), s = typeScore(raw, enemy);
    return `<li class="titem"><div class="trow" role="button" tabindex="0" aria-expanded="false" title="Click to see which moves give these scores">${spriteHtml(p)}<div><strong>${dn(p.name)} <i class="caret">\u25be</i></strong><div class="chips">${p.types.map(chip).join('')}</div></div>${scoreBox(s.off)}${scoreBox(s.def)}</div><div class="tdetail" hidden>${detailHtml(raw, enemy)}</div></li>`;
  }).join('')}</ul></section>`;
  el.innerHTML = `<div class="teams"><p class="note">Offense adds up each Pokémon's strongest move against every opposing Pokémon. Defense does the same for the opposing team's moves against it. Click a Pokémon to see which move gives each score.</p>${list('Your team', m.teams.mine, m.teams.opp)}${list('Opponent', m.teams.opp, m.teams.mine)}</div>`;
  const toggle = row => { const d = row.nextElementSibling, open = d.hidden; d.hidden = !open; row.setAttribute('aria-expanded', open); row.classList.toggle('open', open); };
  el.querySelectorAll('.trow[role=button]').forEach(r => { r.onclick = () => toggle(r); r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(r); } }; });
}

function monCard(p, mode, ann){
  const c = TYPE_COLORS[p.types[0]];
  return `<article class="mon"><header><h3>${dn(p.name)}</h3>${ann ? `<span class="role">${ann.role}</span>` : ''}${mode && !mode.plain ? rankBadge(p) : ''}</header>
    <div class="mon-body"><div><div class="pills"><span>${p.ability}</span><span>${p.item}<img class="iicon" src="${itemUrl(p.item)}" alt="" onerror="this.remove()"></span></div>
    <ul>${p.moves.map(([n, t]) => `<li>${chip(t)}${n}${ann && ann.blue.has(n) ? star('b', 'Good support move') : ''}${ann && ann.yellow.has(n) ? star('y', 'Priority attack') : ''}</li>`).join('')}</ul></div>
    <div class="side"><span class="chips">${p.types.map(chip).join('')}</span><div class="sprite" style="background:radial-gradient(circle at 35% 30%,#fff8,${c})"><span>${p.name[0]}</span><img src="${spriteUrl(p)}" alt="${dn(p.name)}" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></div></div></div></article>`;
}
function renderTeams(el, m, mode){
  const N = !mode.plain && OPP_NOTES[m.id];
  const col = (label, team, opp) => `<section class="team"><h2>${label}</h2><div class="roster">${team.map((p, i) => monCard(shown(p, mode), mode, opp && N ? {role:N.roles[i], blue:new Set(N.blue), yellow:new Set(N.yellow)} : null)).join('')}</div></section>`;
  el.innerHTML = `${N ? `<p class="note keynote">${star('b', '')} Good support move &nbsp; ${star('y', '')} Priority attack &nbsp; (marked on the opponent\u2019s moves)</p>` : ''}<div class="teams">${col('Your team', m.teams.mine)}${col('Opponent', m.teams.opp, true)}</div>`;
}

/* ---- Matchup Tester tab: drag two Pokemon onto the field and see which moves work on the other one ---- */
const effAbility = p => p.ability.split(' / ').pop(); /* megas show "pre-mega / mega", the mega ability is the one in effect */
const SELF_STATUS = new Set(['Protect','Detect','Spiky Shield','Wide Guard','Quick Guard','Tailwind','Calm Mind','Swords Dance','Nasty Plot','Bulk Up','Dragon Dance','Coil','Follow Me','Rage Powder','Helping Hand','Substitute','Aurora Veil','Light Screen','Trick Room','Life Dew','Roost','Baton Pass','Coaching']);
const OPP_STATUS = new Set(['Encore','Disable','Leech Seed','Hypnosis','Sleep Powder','Will-O-Wisp','Yawn','Parting Shot','Psych Up']);
const PRIORITY_MOVES = new Set(['Fake Out','Feint','Sucker Punch','Aqua Jet','Shadow Sneak','Extreme Speed','Quick Attack','Jet Punch']);
const testType = (p, mv) => { const t = moveType(p, mv); return effAbility(p) === 'Pixilate' && t === 'Normal' ? 'Fairy' : t; };
/* kind: self (never flagged), blocked (cannot affect: reason says why), hit (mult = damage multiplier, null for a status move) */
function evalMove(att, mv, def, ally){ /* ally: the Pokemon beside the defender on its side, if any */
  const name = mv[0], type = testType(att, mv), a = effAbility(att), d = effAbility(def);
  if (SELF_STATUS.has(name)) return {kind:'self', type};
  const status = OPP_STATUS.has(name);
  const priority = PRIORITY_MOVES.has(name) || (status && a === 'Prankster') || (a === 'Gale Wings' && type === 'Flying');
  const no = reason => ({kind:'blocked', type, reason});
  if (priority && d === 'Armor Tail') return no('Armor Tail blocks priority moves');
  if (priority && ally && effAbility(ally) === 'Armor Tail') return no(`${dn(ally.name)}\u2019s Armor Tail blocks priority moves on its allies`);
  if (status) {
    if (a === 'Prankster' && def.types.includes('Dark')) return no('Prankster status moves fail on Dark types');
    if (name === 'Leech Seed' && def.types.includes('Grass')) return no('Grass types are immune');
    if (name === 'Sleep Powder' && def.types.includes('Grass')) return no('Grass types are immune to powder');
    if (name === 'Will-O-Wisp' && def.types.includes('Fire')) return no('Fire types cannot be burned');
    if (name === 'Will-O-Wisp' && d === 'Flash Fire') return no('Flash Fire absorbs it');
    return {kind:'hit', type, mult:null};
  }
  if (type === 'Ground' && d === 'Levitate') return no('Levitate');
  if (type === 'Fire' && d === 'Flash Fire') return no('Flash Fire');
  const mult = effect(name, type, def.types);
  if (mult === 0) return no('No effect');
  return {kind:'hit', type, mult};
}
let testMatch = 0, testSlots = [null, null, null, null], testNext = {mine:0, opp:0}; /* slots 0-1 = your team (left), 2-3 = opponent (right) */
const slotSide = i => i < 2 ? 'mine' : 'opp';
function renderTester(el, m){
  if (testMatch !== m.id) { testMatch = m.id; testSlots = [null, null, null, null]; testNext = {mine:0, opp:0}; } /* each matchup starts with an empty field */
  const pool = {};
  m.teams.mine.forEach((p, i) => pool['mine:' + i] = p);
  m.teams.opp.forEach((p, i) => pool['opp:' + i] = p);
  let dragFrom = null; /* what is being dragged right now: a pool key or 'slot:N' */
  const sideOfDrag = () => !dragFrom ? null : dragFrom.startsWith('slot:') ? slotSide(+dragFrom.slice(5)) : dragFrom.split(':')[0];
  const draw = () => {
    const slotMon = i => testSlots[i] ? pool[testSlots[i]] : null;
    const tray = (team, side) => `<div class="tcol ${side}">${team.map((p, i) => { const k = side + ':' + i;
      return `<button class="tp${testSlots.includes(k) ? ' used' : ''}" draggable="true" data-key="${k}" title="${testSlots.includes(k) ? 'Click to take off the field' : 'Drag onto the field, or click to add'}">${spriteHtml(p)}<span>${dn(p.name)}</span></button>`; }).join('')}</div>`;
    /* one move box, checked against every Pokemon on the other side */
    const moveBox = (att, mv, defs) => {
      const type = testType(att, mv), res = defs.map(d => ({d, r:evalMove(att, mv, d, defs.find(x => x !== d))})), self = res.length && res[0].r.kind === 'self';
      const strong = res.some(x => x.r.kind === 'hit' && x.r.mult >= 2);
      const icons = self ? '' : res.map(x => x.r.kind === 'hit' && x.r.mult >= 2
          ? `<span class="good" title="Super effective against ${dn(x.d.name)}"><span class="mini">${spriteHtml(x.d)}</span><b>${multText(x.r.mult)}</b></span>`
          : x.r.kind === 'blocked' ? `<span class="nope" title="Cannot affect ${dn(x.d.name)}: ${x.r.reason}"><span class="mini">${spriteHtml(x.d)}</span></span>` : '').join('');
      return `<li class="tm${strong ? ' strong' : ''}"><span class="tmname">${chip(type)}<span>${mv[0]}</span></span><span class="tmtags">${icons}</span></li>`; };
    const card = (p, defs, i) => `<div class="tcard" draggable="true" data-slot="${i}"><button class="tx" data-clear="${i}" aria-label="Remove ${dn(p.name)} from the field">×</button>
      <div class="thead2">${spriteHtml(p)}<div><strong>${dn(p.name)}</strong><div class="chips">${p.types.map(chip).join('')}</div></div></div>
      <div class="pills"><span>${p.ability}</span><span>${p.item}<img class="iicon" src="${itemUrl(p.item)}" alt="" onerror="this.remove()"></span></div>
      <ul class="tmoves">${p.moves.map(mv => moveBox(p, mv, defs)).join('')}</ul></div>`;
    const zones = side => { const idx = side === 'mine' ? [0, 1] : [2, 3], enemy = (side === 'mine' ? [2, 3] : [0, 1]).map(slotMon).filter(Boolean);
      return `<div class="zcol">${idx.map(i => { const p = slotMon(i); return `<div class="zone${p ? ' full' : ''}" data-slot="${i}">${p ? card(p, enemy, i) : `<div class="zhint">Drop a ${side === 'mine' ? 'Pokémon from your team' : 'Pokémon from the opponent’s team'}</div>`}</div>`; }).join('')}</div>`; };
    el.innerHTML = `<div class="tester">
      <p class="note">Drag up to two Pokémon from each team onto the field, or click one to add it (click again to remove it). <span class="legend2"><i class="swatch gold"></i>Super effective, with the Pokémon it is good against <i class="swatch x">\u00d7</i>Cannot affect that Pokémon (self-targeting moves like Protect never get one)</span></p>
      <div class="tctl"><button class="cbtn" data-act="clear">Clear field</button></div>
      <div class="field">${tray(m.teams.mine, 'mine')}${zones('mine')}<div class="vs">VS</div>${zones('opp')}${tray(m.teams.opp, 'opp')}</div></div>`;
    const place = (k, i) => { if (k) testSlots = testSlots.map(x => x === k ? null : x); testSlots[i] = k; draw(); };
    el.querySelectorAll('.tp').forEach(b => {
      b.ondragstart = e => { dragFrom = b.dataset.key; e.dataTransfer.setData('text/plain', dragFrom); e.dataTransfer.effectAllowed = 'move'; };
      b.ondragend = () => { dragFrom = null; };
      b.onclick = () => { const k = b.dataset.key, side = k.split(':')[0], at = testSlots.indexOf(k);
        if (at >= 0) return place(null, at);
        const range = side === 'mine' ? [0, 1] : [2, 3]; let i = range.find(j => !testSlots[j]);
        if (i === undefined) { i = range[testNext[side]]; testNext[side] = 1 - testNext[side]; } place(k, i); };
    });
    el.querySelectorAll('.tcard').forEach(c => { c.ondragstart = e => { dragFrom = 'slot:' + c.dataset.slot; e.dataTransfer.setData('text/plain', dragFrom); e.dataTransfer.effectAllowed = 'move'; };
      c.ondragend = () => { dragFrom = null; }; });
    el.querySelectorAll('.zone').forEach(z => {
      const i = +z.dataset.slot, ok = () => sideOfDrag() === slotSide(i);
      z.ondragover = e => { if (ok()) { e.preventDefault(); z.classList.add('over'); } };
      z.ondragleave = () => z.classList.remove('over');
      z.ondrop = e => { e.preventDefault(); if (!ok()) return;
        if (dragFrom.startsWith('slot:')) { const j = +dragFrom.slice(5); [testSlots[i], testSlots[j]] = [testSlots[j], testSlots[i]]; draw(); }
        else place(dragFrom, i); dragFrom = null; };
    });
    el.querySelectorAll('.tx').forEach(b => b.onclick = () => place(null, +b.dataset.clear));
    el.querySelector('[data-act=clear]').onclick = () => { testSlots = [null, null, null, null]; testNext = {mine:0, opp:0}; draw(); };
  };
  draw();
}

/* Each view gets (container element, matchup object). Add a tab by adding an entry. */
/* Plain = original team-sheet look (no megas). Specialized = everything, plus extra tabs. */
const MODES = {
  plain:       {label:'Plain Visualization',       plain:true,  views:[{id:'main', label:'Main', render:renderMain}]},
  specialized: {label:'Specialized Visualization', plain:false, views:[{id:'main', label:'Main', render:renderMain}, {id:'types', label:'Type matchups', render:renderTypes}, {id:'nodes', label:'Synergy Chart', render:renderNodes}, {id:'tester', label:'Matchup Tester', render:renderTester}]}
};

function renderMain(el, m, mode){
  if (m.teams) return renderTeams(el, m, mode);
  el.innerHTML = `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${m.title} main view placeholder">
    <rect x="60" y="40" width="680" height="340" rx="6" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="400" y="215" text-anchor="middle" font-size="22">Main view for ${m.title}</text>
    <text x="400" y="245" text-anchor="middle" font-size="15">Data goes here.</text></svg>`;
}
function renderNodeLink(el, m){
  const n = 6, cx = 400, cy = 205, r = 120;
  const pts = Array.from({length:n}, (_, i) => [cx + r*Math.cos(i*2*Math.PI/n - Math.PI/2), cy + r*Math.sin(i*2*Math.PI/n - Math.PI/2)]);
  let links = '';
  for (let i = 0; i < n; i++) for (let j = i+1; j < n; j++)
    if ((j-i) === 1 || (j-i) === 3) links += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="var(--line)" stroke-width="2"/>`;
  el.innerHTML = `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${m.title} node-link view placeholder">
    ${links}${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="var(--surface)" stroke="var(--blue)" stroke-width="3"/>`).join('')}
    <text x="400" y="405" text-anchor="middle" font-size="18">Node-link view for ${m.title}. Data goes here.</text></svg>`;
}

/* ---------- Router: #  |  #plain  |  #plain-3  |  #specialized ---------- */
const app = document.getElementById('app');
let currentTab = 'main';

function route(){
  const h = location.hash.slice(1);
  const mm = /^(plain|specialized)-(\d+)$/.exec(h);
  if (mm && MATCHUPS[mm[2]-1]) return showMatchup(+mm[2], mm[1]);
  if (h === 'plain' || h === 'specialized') return showList(h);
  showHub();
}

function showHub(){
  document.title = 'Pokémon matchup visualizations';
  app.innerHTML = `<main class="hub">
    <div class="hub-title">Pokémon matchup<br>visualizations</div>
    <a class="half plain" href="#plain"><h2>Plain Visualization</h2><p>Browse the ten matchups one at a time.</p></a>
    <a class="half spec" href="#specialized"><h2>Specialized Visualization</h2><p>Custom views built for specific questions.</p></a>
    <svg class="ball" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff"/><path d="M4 50a46 46 0 0 1 92 0z" fill="#E3350D"/><rect x="4" y="45" width="92" height="10" fill="#222"/><circle cx="50" cy="50" r="46" fill="none" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="15" fill="#fff" stroke="#222" stroke-width="5"/><circle cx="50" cy="50" r="7" fill="#fff" stroke="#222" stroke-width="2"/></svg></main>`;
}

function showList(mode = 'plain'){
  document.title = MODES[mode].label;
  app.innerHTML = `<main class="page">
    <div class="bar"><a class="btn" href="#">Back</a><div class="mid"><h1>${MODES[mode].label}</h1></div><span></span></div>
    <nav class="grid" aria-label="Matchups">${MATCHUPS.map(m => `<a class="tile" href="#${mode}-${m.id}">${m.title}</a>`).join('')}</nav></main>`;
}

function showSpecialized(){
  document.title = 'Specialized Visualization';
  app.innerHTML = `<main class="page">
    <div class="bar"><a class="btn" href="#">Back</a><div class="mid"><h1>Specialized Visualization</h1></div><span></span></div>
    <div class="soon"><h2>Nothing here yet</h2><p>Specialized views will be added after the plain visualizations.</p></div></main>`;
}

function showMatchup(id, mode = 'plain'){
  const views = MODES[mode].views;
  const m = MATCHUPS[id-1], prev = MATCHUPS[id-2], next = MATCHUPS[id];
  document.title = m.title;
  const nav = (t, label, dir) => t
    ? `<a class="btn" href="#${mode}-${t.id}" aria-label="${dir} matchup">${label}</a>`
    : `<span class="btn" aria-disabled="true" aria-label="No ${dir} matchup">${label}</span>`;
  app.innerHTML = `<main class="page">
    <div class="bar">
      <div>${nav(prev, '‹ Previous', 'previous')}</div>
      <div class="mid"><h1>${m.title}</h1><a href="#${mode}">All matchups</a></div>
      <div class="right">${nav(next, 'Next ›', 'next')}</div>
    </div>
    ${views.length > 1 ? `<div class="tabs" role="tablist">${views.map(v => `<button class="tab" role="tab" id="tab-${v.id}" data-view="${v.id}">${v.label}</button>`).join('')}</div>` : ''}
    <div class="stage" id="stage" role="tabpanel"></div></main>`;
  const stage = document.getElementById('stage');
  const select = viewId => {
    const view = views.find(v => v.id === viewId) || views[0];
    currentTab = view.id;
    app.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === view.id));
    stage.setAttribute('aria-labelledby', 'tab-' + view.id);
    view.render(stage, m, MODES[mode]);
  };
  app.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => select(t.dataset.view)));
  select(currentTab);
}

document.addEventListener('keydown', e => {
  const mm = /^(plain|specialized)-(\d+)$/.exec(location.hash.slice(1));
  if (!mm || e.target.closest('input,textarea')) return;
  const id = +mm[2] + (e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0);
  if (id !== +mm[2] && MATCHUPS[id-1]) location.hash = mm[1] + '-' + id;
});
window.addEventListener('hashchange', route);
route();
</script>
